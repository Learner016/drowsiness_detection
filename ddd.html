<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Drowsiness Detection — OpenCV</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app">
  <h1>Driver Drowsiness Detection</h1><p class="sub">OpenCV + Face Landmark Eye Aspect Ratio (EAR)</p>
  <div class="videoBox"><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas><div id="message">Press <b>START CAMERA</b></div></div>
  <div class="buttons"><button id="start">START CAMERA</button><button id="recalibrate" disabled>RECALIBRATE</button><button id="stop" disabled>STOP</button></div>
  <div id="status" class="status" role="status">READY</div>
  <div class="result"><div><small>FACE</small><b id="face">NO FACE</b></div><div><small>EYES</small><b id="eyes">NO FACE</b></div><div><small>CLOSED</small><b id="closed">0.00 s</b></div><div><small>QUALITY</small><b id="quality">--</b></div></div>
  <div class="ear"><span>LEFT EAR: <b id="leftEar">--</b></span><span>RIGHT EAR: <b id="rightEar">--</b></span><span>THRESHOLD: <b id="threshold">--</b></span></div>
  <p class="help">Keep both eyes open during calibration. The green box and dots show the detected face and eyes.</p><p class="error" id="error" role="alert"></p>
</div><script type="module" src="ddd.js"></script></body></html>
